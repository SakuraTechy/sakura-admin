worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    upstream admin-server {
        ip_hash;
        server continew-admin-server:18000;
    }

    # 单 IP 本地部署不依赖域名和证书；前端与 API 通过同一来源访问。
    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # 前端生产包使用 /api 前缀，代理时去掉该前缀还原后端路径。
        location /api/ {
            proxy_pass http://admin-server/;
            proxy_ignore_client_abort on;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gitee 动态接口由 Nginx 转发到 Gitee，不能进入 Admin 后端。
        # proxy_pass 末尾的斜杠会去掉 /api/gitee 前缀，还原为 Gitee 的接口路径。
        location /api/gitee/ {
            proxy_pass https://gitee.com/;
            proxy_ssl_server_name on;
            proxy_set_header Host gitee.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 本地文件存储 URL 仍由后端处理，避免被前端静态路由接管。
        location /file/ {
            proxy_pass http://admin-server/file/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
