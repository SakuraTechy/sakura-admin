bind 0.0.0.0
# redis 密码
requirepass 3edc%RFV

# CosId 机器号租约保护：禁用淘汰策略，确保租约 key 不会被意外删除
maxmemory-policy noeviction

# key 监听器配置
# notify-keyspace-events Ex

# 配置持久化文件存储路径
dir ../data
# 配置rdb
# 15分钟内有至少1个key被更改则进行快照
save 900 1
# 5分钟内有至少10个key被更改则进行快照
save 300 10
# 1分钟内有至少10000个key被更改则进行快照
save 60 10000
# 开启压缩
rdbcompression yes
# rdb文件名 用默认的即可
dbfilename dump.rdb

# 开启aof
appendonly yes
# 文件名
appendfilename "appendonly.aof"
# 持久化策略,no:不同步,everysec:每秒一次,always:总是同步,速度比较慢
# appendfsync always
appendfsync everysec
# appendfsync no

# TCP keepalive 配置，防止长连接被中间设备断开
tcp-keepalive 300

# 客户端连接超时时间（0 表示不超时）
timeout 0
